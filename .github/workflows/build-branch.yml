name: Branch Build CE

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: "Type of build to run"
        required: true
        type: choice
        default: "Build"
        options:
          - "Build"
          - "Release"
      releaseVersion:
        description: "Release Version"
        type: string
        default: v0.0.0
      isPrerelease:
        description: "Is Pre-release"
        type: boolean
        default: false
        required: true
  push:
    branches:
      - preview
      - canary
    tags:
      - "v*.*.*"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# REQUIRED: Grants the GITHUB_TOKEN permission to push to the GitHub Container Registry
permissions:
  contents: read
  packages: write

env:
  TARGET_BRANCH: ${{ github.ref_name }}
  BUILD_TYPE: ${{ github.event.inputs.build_type }}
  RELEASE_VERSION: ${{ github.event.inputs.releaseVersion }}
  IS_PRERELEASE: ${{ github.event.inputs.isPrerelease }}
  REGISTRY: ghcr.io
  IMAGE_OWNER: ${{ github.repository_owner }}

jobs:
  branch_build_setup:
    # ONLY run if triggered manually, OR if commit message contains "release", OR if a tag is pushed
    if: >
      github.event_name == 'workflow_dispatch' || 
      contains(github.event.head_commit.message, 'release') || 
      startsWith(github.ref, 'refs/tags/')
    name: Build Setup
    runs-on: ubuntu-24.04-arm
    outputs:
      gh_branch_name: ${{ steps.set_env_variables.outputs.TARGET_BRANCH }}
      skip_duplicate: ${{ steps.check_duplicate.outputs.skip }}
      dh_img_web: slane-frontend
      dh_img_space: slane-space
      dh_img_admin: slane-admin
      dh_img_live: slane-live
      dh_img_backend: slane-backend
    steps:
      - id: set_env_variables
        name: Set Environment Variables
        run: |
          BR_NAME=$( echo "${{ env.TARGET_BRANCH }}" |sed 's/[^a-zA-Z0-9.-]//g')
          echo "TARGET_BRANCH=$BR_NAME" >> $GITHUB_OUTPUT

      # If this run was triggered by a push to a branch (preview/canary) AND the
      # same commit already has a matching vX.Y.Z tag, skip it. The tag push
      # fires its own separate run of this workflow, and that's the only one
      # we want to actually build/push images.
      - name: Checkout (with tags)
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/heads/')
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - id: check_duplicate
        name: Check for a tag already pointing at this commit
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/heads/')
        run: |
          MATCHING_TAG=$(git tag --points-at HEAD | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' || true)
          if [ -n "$MATCHING_TAG" ]; then
            echo "Found tag(s) on this commit: $MATCHING_TAG -> skipping branch-triggered build"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

  branch_build_push_admin:
    if: >
      needs.branch_build_setup.outputs.skip_duplicate != 'true' && (
        github.event_name == 'workflow_dispatch' || 
        contains(github.event.head_commit.message, 'release') || 
        startsWith(github.ref, 'refs/tags/')
      )
    name: Build-Push Admin Docker Image
    runs-on: ubuntu-24.04-arm
    needs: [branch_build_setup]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Admin Build and Push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./apps/admin/Dockerfile.admin
          platforms: linux/arm64
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/${{ needs.branch_build_setup.outputs.dh_img_admin }}:${{ needs.branch_build_setup.outputs.gh_branch_name }}

  branch_build_push_web:
    if: >
      needs.branch_build_setup.outputs.skip_duplicate != 'true' && (
        github.event_name == 'workflow_dispatch' || 
        contains(github.event.head_commit.message, 'release') || 
        startsWith(github.ref, 'refs/tags/')
      )
    name: Build-Push Web Docker Image
    runs-on: ubuntu-24.04-arm
    needs: [branch_build_setup]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Web Build and Push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./apps/web/Dockerfile.web
          platforms: linux/arm64
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/${{ needs.branch_build_setup.outputs.dh_img_web }}:${{ needs.branch_build_setup.outputs.gh_branch_name }}

  branch_build_push_space:
    if: >
      needs.branch_build_setup.outputs.skip_duplicate != 'true' && (
        github.event_name == 'workflow_dispatch' || 
        contains(github.event.head_commit.message, 'release') || 
        startsWith(github.ref, 'refs/tags/')
      )
    name: Build-Push Space Docker Image
    runs-on: ubuntu-24.04-arm
    needs: [branch_build_setup]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Space Build and Push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./apps/space/Dockerfile.space
          platforms: linux/arm64
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/${{ needs.branch_build_setup.outputs.dh_img_space }}:${{ needs.branch_build_setup.outputs.gh_branch_name }}

  branch_build_push_live:
    if: >
      needs.branch_build_setup.outputs.skip_duplicate != 'true' && (
        github.event_name == 'workflow_dispatch' || 
        contains(github.event.head_commit.message, 'release') || 
        startsWith(github.ref, 'refs/tags/')
      )
    name: Build-Push Live Docker Image
    runs-on: ubuntu-24.04-arm
    needs: [branch_build_setup]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Live Build and Push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./apps/live/Dockerfile.live
          platforms: linux/arm64
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/${{ needs.branch_build_setup.outputs.dh_img_live }}:${{ needs.branch_build_setup.outputs.gh_branch_name }}

  branch_build_push_api:
    if: >
      needs.branch_build_setup.outputs.skip_duplicate != 'true' && (
        github.event_name == 'workflow_dispatch' || 
        contains(github.event.head_commit.message, 'release') || 
        startsWith(github.ref, 'refs/tags/')
      )
    name: Build-Push API Server Docker Image
    runs-on: ubuntu-24.04-arm
    needs: [branch_build_setup]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Backend Build and Push
        uses: docker/build-push-action@v6
        with:
          context: ./apps/api
          file: ./apps/api/Dockerfile.api
          platforms: linux/arm64
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/${{ needs.branch_build_setup.outputs.dh_img_backend }}:${{ needs.branch_build_setup.outputs.gh_branch_name }}
